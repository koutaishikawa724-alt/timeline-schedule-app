# App Store 用の iOS アプリを作り、App Store Connect に送る。
# GitHub の「Actions」タブ → 「iOS App Store」→「Run workflow」で手動で動かす（PCは不要）。
# 必要な Secrets（Settings → Secrets and variables → Actions）:
#   EXPO_TOKEN            expo.dev のアクセストークン
#   ASC_API_KEY_P8        App Store Connect API キー（.p8 ファイルの中身をそのまま）
#   ASC_KEY_ID            その API キーの Key ID
#   ASC_ISSUER_ID         Issuer ID
#   APPLE_TEAM_ID         Apple Developer のチーム ID
name: iOS App Store

on:
  workflow_dispatch:
    inputs:
      asc_app_id:
        description: App Store Connect のアプリの「Apple ID」（数字10桁ほど。App情報のページにあります）
        required: true

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: App Store Connect API キーを置く
        run: printf '%s' "${{ secrets.ASC_API_KEY_P8 }}" > "$RUNNER_TEMP/asc_api_key.p8"

      - name: EAS のプロジェクトとつなぐ（初回は自動で作る）
        run: eas init --non-interactive --force

      - name: 送り先のアプリを設定する
        run: |
          node -e "const f='eas.json';const j=require('./'+f);j.submit.production.ios={ascAppId:process.argv[1]};require('fs').writeFileSync(f,JSON.stringify(j,null,2))" "${{ inputs.asc_app_id }}"

      - name: ビルドして App Store Connect に送る
        env:
          EXPO_ASC_API_KEY_PATH: ${{ runner.temp }}/asc_api_key.p8
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
        run: eas build --platform ios --profile production --non-interactive --auto-submit --wait
